server.port=8081
spring.application.name=ai-alibaba-demo

# OpenAI (兼容火山引擎豆包)
spring.ai.openai.base-url=https://ark.cn-beijing.volces.com/api
spring.ai.openai.api-key=xxx
spring.ai.openai.chat.options.model=doubao-seed-2-0-pro-260215
spring.ai.openai.chat.options.reasoning-effort=low
spring.ai.openai.chat.completions-path=/v3/chat/completions
spring.ai.retry.max-attempts=3
spring.ai.retry.on-client-errors=false
spring.profiles.active=dev

# emb
spring.ai.openai.embedding.base-url=https://api.siliconflow.cn
spring.ai.openai.embedding.api-key=sk-xxx
spring.ai.openai.embedding.options.model=BAAI/bge-m3

# milvus
spring.ai.vectorstore.milvus.client.host=192.168.255.134
spring.ai.vectorstore.milvus.client.port=19530
spring.ai.vectorstore.milvus.client.username=root
spring.ai.vectorstore.milvus.client.password=
spring.ai.vectorstore.milvus.database-name=spring_ai_demo
spring.ai.vectorstore.milvus.collection-name=vector_store
spring.ai.vectorstore.milvus.embedding-dimension=1024
spring.ai.vectorstore.milvus.index-type=ivf-flat
spring.ai.vectorstore.milvus.metric-type=cosine
spring.ai.vectorstore.milvus.initialize-schema=true


logging.level.root=info
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG
